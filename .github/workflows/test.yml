name: test
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.8", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python skills/journey-audit/scripts/journey_check.py check examples/card-reissue/journey.json
      - name: Validate skill frontmatter
        run: |
          for f in skills/*/SKILL.md; do
            head -1 "$f" | grep -q '^---$' || { echo "no frontmatter: $f"; exit 1; }
            grep -q '^name: ' "$f" && grep -q '^description: ' "$f" || { echo "missing name/description: $f"; exit 1; }
          done
  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Plugin manifests (Claude Code and Codex)
        run: |
          python - <<'PY'
          import json, glob, tomllib
          for p in [".claude-plugin/plugin.json", ".claude-plugin/marketplace.json",
                    ".codex-plugin/plugin.json", ".agents/plugins/marketplace.json"]:
              json.load(open(p)); print("json ok", p)
          versions = {json.load(open(p))["version"] for p in [".claude-plugin/plugin.json", ".codex-plugin/plugin.json"]}
          assert len(versions) == 1, versions
          for p in glob.glob("codex/agents/*.toml"):
              d = tomllib.load(open(p, "rb"))
              assert {"name", "description", "developer_instructions"} <= set(d), p
              print("toml ok", p)
          PY
